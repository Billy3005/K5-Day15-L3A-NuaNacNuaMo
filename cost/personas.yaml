# Mô phỏng chi phí khi dùng thật — Track F (Lộ trình tự học có dẫn nguồn · Nửa Nạc Nửa Mỡ).
# Mọi số đều có nguồn công khai hoặc ghi rõ "(tự ước tính)".
# Chạy thử khung: python3 run.py simulate --try
# Chạy bản nộp:   python3 run.py simulate --rate-from eval/run-2.csv

sessions: 50        # số phiên mô phỏng — bản nộp CP4 ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # 3 kịch bản số người dùng hoạt động / tháng cho sản phẩm Track F (sinh viên tự học)
  low: 500
  base: 3000
  high: 15000
  source: "Quy mô thí điểm sinh viên đại học tại VN: mức cơ sở 3.000 SV tương đương quy mô 1 trường đại học như VinUni (~3.000 SV, https://vinuni.edu.vn · xem 27/11/2026); toàn quốc có ~2,6 triệu SV đại học (~848 nghìn SV STEM theo thống kê Bộ GD&ĐT 08/2026). Ba kịch bản 500 (một khoa) / 3.000 (một trường) / 15.000 (liên trường) người dùng hoạt động/tháng là (tự ước tính)."

personas:           # 3 nhóm mức độ dùng theo spec.md §2 & canvas.md; tổng share = 1.0
  - name: dung_it
    share: 0.50
    uses_per_month: 1
    turns_per_session: 1
    source: "spec.md §2 & canvas.md — sinh viên tạo 1 lộ trình/tháng trước bài tập nhỏ, 1 lượt hỏi/phiên (tự ước tính, cập nhật sau phỏng vấn BAO-02)"
  - name: dung_vua
    share: 0.35
    uses_per_month: 3
    turns_per_session: 2
    source: "spec.md §2 & canvas.md — sinh viên tự học 3 lộ trình/tháng cho bài tập nhóm/đồ án, 2 lượt/phiên gồm tạo mới và thu hẹp mục tiêu (tự ước tính, cập nhật sau phỏng vấn BAO-02)"
  - name: dung_nhieu
    share: 0.15
    uses_per_month: 8
    turns_per_session: 3
    source: "spec.md §2 & canvas.md — sinh viên tự học nhiều kỹ năng song song 8 lộ trình/tháng, 3 lượt/phiên gồm làm rõ và điều chỉnh trình độ (tự ước tính, cập nhật sau phỏng vấn BAO-02)"

prices:             # USD / 1 triệu token — khớp stack thật PR #2 (OpenAI soạn bài + Claude web_search) và các mức so sánh
  - model: claude-haiku-5-5
    input: 0.10
    output: 0.50
    source: "https://www.anthropic.com/pricing · xem 27/11/2026 (model tìm kiếm web SEARCH_MODEL mặc định, prompt <= 100K token; phí công cụ web_search $10 / 1.000 lượt được cộng tách riêng trong cost/cost-estimate.md)"
  - model: gpt-5.4-nano
    input: 0.20
    output: 1.25
    source: "https://openai.com/api/pricing/ · xem 27/11/2026 (mức rẻ — model soạn bài thực tế đang nối trong codebase/ai.py)"
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "https://openai.com/api/pricing/ · xem 27/11/2026 (mức cân bằng để so sánh)"
  - model: gpt-5.4
    input: 2.50
    output: 15.00
    source: "https://openai.com/api/pricing/ · xem 27/11/2026 (mức mạnh flagship để so sánh, prompt <= 272K token)"

usd_to_vnd:
  rate: 26000
  source: "https://www.vietcombank.com.vn/vi-VN/KHCN/Cong-cu-Tien-ich/Ty-gia · xem 27/11/2026 (tỷ giá bán ra ~26.010 ₫/USD, làm tròn)"
